<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');
      .text-main { font-family: 'Inter', -apple-system, sans-serif; fill: #F8FAFC; }
      .text-muted { font-family: 'Inter', -apple-system, sans-serif; fill: #94A3B8; }
      .text-mono { font-family: 'JetBrains Mono', monospace; }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#8B5CF6;#3B82F6;#EC4899" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#3B82F6;#EC4899;#8B5CF6" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#EC4899;#8B5CF6;#3B82F6" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1180" height="610" rx="20" fill="url(#bgGrad)"/>
  <rect width="1180" height="610" rx="20" fill="url(#gridPattern)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="140" fill="#EC4899" opacity="0.1" filter="url(#softGlow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 30,-20; 0,0" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="420" r="160" fill="#3B82F6" opacity="0.12" filter="url(#softGlow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -30,20; 0,0" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= LEFT PANEL: BRAND & LOGS ================= -->
  <g transform="translate(45, 45)" filter="url(#dropShadow)">
    <rect width="400" height="520" rx="16" fill="url(#panelGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    
    <!-- Header Badge -->
    <rect x="24" y="24" width="130" height="24" rx="12" fill="rgba(236, 72, 153, 0.15)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1"/>
    <text x="89" y="40" class="text-mono" font-size="10" font-weight="700" fill="#F472B6" text-anchor="middle" letter-spacing="1">SYSTEM_ONLINE</text>
    <circle cx="365" cy="36" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Ultra-Clean Bold Typography Monogram: YLS -->
    <g transform="translate(45, 85)">
      <!-- Outer Glow Accent -->
      <text x="0" y="70" class="text-mono" font-size="78" font-weight="800" fill="url(#neonGlow)" letter-spacing="8" filter="url(#softGlow)" opacity="0.4">YLS</text>
      <!-- Crisp Foreground Monogram -->
      <text x="0" y="70" class="text-mono" font-size="78" font-weight="800" fill="url(#neonGlow)" letter-spacing="8">YLS</text>
      <!-- Subtitle Badge -->
      <text x="5" y="105" class="text-mono" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="3">INITIALS // ARCHITECT</text>
    </g>

    <line x1="24" y1="215" x2="376" y2="215" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Terminal Status Stream -->
    <g transform="translate(24, 235)" class="text-mono" font-size="11">
      <g transform="translate(0, 0)">
        <text x="0" y="15" fill="#EC4899" font-weight="700">></text>
        <text x="16" y="15" fill="#E2E8F0">Initializing EcoPackAI Engine...</text>
        <text x="320" y="15" fill="#10B981" font-weight="700">OK</text>
      </g>
      <g transform="translate(0, 32)">
        <text x="0" y="15" fill="#8B5CF6" font-weight="700">></text>
        <text x="16" y="15" fill="#E2E8F0">Loading GradePath OCR Pipeline</text>
        <text x="320" y="15" fill="#10B981" font-weight="700">OK</text>
      </g>
      <g transform="translate(0, 64)">
        <text x="0" y="15" fill="#3B82F6" font-weight="700">></text>
        <text x="16" y="15" fill="#E2E8F0">Syncing AWS Cloud Clusters</text>
        <text x="320" y="15" fill="#10B981" font-weight="700">OK</text>
      </g>
      <g transform="translate(0, 96)">
        <text x="0" y="15" fill="#06B6D4" font-weight="700">></text>
        <text x="16" y="15" fill="#E2E8F0">Connecting Infosys Springboard</text>
        <text x="320" y="15" fill="#10B981" font-weight="700">OK</text>
      </g>
      <g transform="translate(0, 128)">
        <text x="0" y="15" fill="#10B981" font-weight="700">></text>
        <text x="16" y="15" fill="#E2E8F0">Deploying REST Microservices</text>
        <text x="320" y="15" fill="#10B981" font-weight="700">OK</text>
      </g>
    </g>

    <!-- Bottom Pulse Tag -->
    <g transform="translate(24, 455)">
      <rect width="352" height="40" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <circle cx="20" cy="20" r="4" fill="#3B82F6"/>
      <text x="34" y="24" class="text-mono" font-size="11" fill="#94A3B8">STATUS: <tspan fill="#F8FAFC" font-weight="700">Building Smart AI Solutions</tspan></text>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: PROFILE DASHBOARD ================= -->
  <g transform="translate(475, 45)" filter="url(#dropShadow)">
    <rect width="660" height="520" rx="16" fill="url(#panelGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <!-- Window Controls -->
    <circle cx="30" cy="30" r="5" fill="#EF4444"/>
    <circle cx="48" cy="30" r="5" fill="#F59E0B"/>
    <circle cx="66" cy="30" r="5" fill="#10B981"/>
    <text x="90" y="34" class="text-mono" font-size="11" fill="#64748B">developer-profile.config</text>

    <!-- Content Block -->
    <g transform="translate(35, 75)">
      
      <!-- Greeting & Name -->
      <text x="0" y="24" class="text-main" font-size="30" font-weight="800" letter-spacing="-0.5">
        Hi 👋 I'm <tspan fill="url(#neonGlow)">Yemmala Lekhasree</tspan>
      </text>

      <!-- Typing Role Animation -->
      <g transform="translate(0, 60)">
        <text x="0" y="0" class="text-mono" font-size="16" font-weight="700" fill="#F472B6">></text>
        <g class="text-mono" font-size="15" font-weight="600" fill="#F8FAFC">
          <text x="20" y="0">
            <animate attributeName="display" values="inline;none;none;none;none" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"/>
            AI &amp; Machine Learning Specialist
          </text>
          <text x="20" y="0">
            <animate attributeName="display" values="none;inline;none;none;none" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"/>
            Python &amp; REST API Engineer
          </text>
          <text x="20" y="0">
            <animate attributeName="display" values="none;none;inline;none;none" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"/>
            AWS Cloud Architecture Intern
          </text>
          <text x="20" y="0">
            <animate attributeName="display" values="none;none;none;inline;none" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"/>
            Full-Stack Web Architect
          </text>
        </g>
        <!-- Cursor -->
        <rect x="330" y="-13" width="7" height="16" fill="#3B82F6">
          <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
        </rect>
      </g>

      <line x1="0" y1="85" x2="590" y2="85" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

      <!-- Profile Details Cards -->
      <g transform="translate(0, 115)" font-size="13">
        <g transform="translate(0, 0)">
          <rect width="280" height="48" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
          <text x="14" y="20" class="text-muted" font-size="11" font-weight="600">EDUCATION</text>
          <text x="14" y="37" class="text-main" font-weight="600" font-size="12">B.Tech CSE (AI &amp; ML) @ MITS</text>
        </g>

        <g transform="translate(295, 0)">
          <rect width="295" height="48" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
          <text x="14" y="20" class="text-muted" font-size="11" font-weight="600">RECENT INTERNSHIP</text>
          <text x="14" y="37" class="text-main" font-weight="600" font-size="12">AI Intern @ Infosys Springboard</text>
        </g>

        <g transform="translate(0, 60)">
          <rect width="280" height="48" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
          <text x="14" y="20" class="text-muted" font-size="11" font-weight="600">CLOUD EXPERIENCE</text>
          <text x="14" y="37" class="text-main" font-weight="600" font-size="12">AWS Cloud Intern @ Saraj Innotech</text>
        </g>

        <g transform="translate(295, 60)">
          <rect width="295" height="48" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
          <text x="14" y="20" class="text-muted" font-size="11" font-weight="600">FEATURED PROJECTS</text>
          <text x="14" y="37" class="text-main" font-weight="600" font-size="12">EcoPackAI • GradePath • FoodDash</text>
        </g>
      </g>

      <!-- Tech Stack Badges -->
      <g transform="translate(0, 260)">
        <text x="0" y="0" class="text-mono" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">PRIMARY TECH STACK</text>

        <!-- Row 1 -->
        <g transform="translate(0, 16)">
          <rect width="76" height="28" rx="14" fill="#1E293B" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          <text x="38" y="18" class="text-main" font-size="12" font-weight="600" text-anchor="middle">Python</text>

          <g transform="translate(84, 0)">
            <rect width="70" height="28" rx="14" fill="#1E293B" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
            <text x="35" y="18" class="text-main" font-size="12" font-weight="600" text-anchor="middle">Flask</text>
          </g>

          <g transform="translate(162, 0)">
            <rect width="78" height="28" rx="14" fill="#1E293B" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
            <text x="39" y="18" class="text-main" font-size="12" font-weight="600" text-anchor="middle">Django</text>
          </g>

          <g transform="translate(248, 0)">
            <rect width="104" height="28" rx="14" fill="url(#panelGrad)" stroke="url(#neonGlow)" stroke-width="1.5"/>
            <text x="52" y="18" class="text-main" font-size="12" font-weight="700" text-anchor="middle" fill="#3B82F6">AWS Cloud</text>
          </g>

          <g transform="translate(360, 0)">
            <rect width="84" height="28" rx="14" fill="#1E293B" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
            <text x="42" y="18" class="text-main" font-size="12" font-weight="600" text-anchor="middle">MongoDB</text>
          </g>

          <g transform="translate(452, 0)">
            <rect width="68" height="28" rx="14" fill="#1E293B" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
            <text x="34" y="18" class="text-main" font-size="12" font-weight="600" text-anchor="middle">MySQL</text>
          </g>
        </g>

        <!-- Row 2 -->
        <g transform="translate(0, 52)">
          <rect width="136" height="28" rx="14" fill="#1E293B" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          <text x="68" y="18" class="text-main" font-size="12" font-weight="600" text-anchor="middle">Machine Learning</text>

          <g transform="translate(144, 0)">
            <rect width="114" height="28" rx="14" fill="#1E293B" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
            <text x="57" y="18" class="text-main" font-size="12" font-weight="600" text-anchor="middle">Random Forest</text>
          </g>

          <g transform="translate(266, 0)">
            <rect width="84" height="28" rx="14" fill="#1E293B" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
            <text x="42" y="18" class="text-main" font-size="12" font-weight="600" text-anchor="middle">XGBoost</text>
          </g>

          <g transform="translate(358, 0)">
            <rect width="86" height="28" rx="14" fill="#1E293B" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
            <text x="43" y="18" class="text-main" font-size="12" font-weight="600" text-anchor="middle">REST APIs</text>
          </g>
        </g>
      </g>

      <!-- Footer Bar -->
      <g transform="translate(0, 385)">
        <line x1="0" y1="0" x2="590" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
        <g transform="translate(0, 16)">
          <!-- Connect Links -->
          <text x="0" y="16" class="text-mono" font-size="12" fill="#EC4899" font-weight="700">⚡ GitHub: <tspan fill="#F8FAFC">lekhasree0910</tspan></text>
          <text x="210" y="16" class="text-mono" font-size="12" fill="#3B82F6" font-weight="700">✉️ Email: <tspan fill="#F8FAFC">lekhasree0910@gmail.com</tspan></text>
        </g>
      </g>

    </g>
  </g>
</svg>
